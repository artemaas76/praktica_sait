<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дела | Дневник</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        .navbar { background: white; border-bottom: 1px solid #e2e8f0; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 700; color: #1e3a8a; }
        .back-btn { background: #f1f5f9; color: #1e293b; padding: 8px 16px; border-radius: 12px; text-decoration: none; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 24px; }
        h1 { font-size: 32px; font-weight: 700; color: #0f172a; }
        .sub { color: #64748b; margin-bottom: 32px; }
        .form-card { background: white; border-radius: 24px; padding: 24px; border: 1px solid #e2e8f0; margin-bottom: 32px; }
        .input-group { display: flex; gap: 12px; }
        .input-group input { flex: 1; padding: 14px; border: 2px solid #e2e8f0; border-radius: 16px; }
        button { background: #1e3a8a; color: white; border: none; padding: 14px 28px; border-radius: 16px; font-weight: 600; cursor: pointer; }
        .task-card { background: white; border-radius: 16px; padding: 16px 20px; border: 1px solid #e2e8f0; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .task-left { display: flex; align-items: center; gap: 16px; }
        .task-check { width: 24px; height: 24px; border-radius: 8px; border: 2px solid #cbd5e1; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
        .task-check.done { background: #10b981; border-color: #10b981; color: white; }
        .task-title.done { text-decoration: line-through; color: #94a3b8; }
        .delete-task { color: #ef4444; text-decoration: none; background: #fee2e2; padding: 6px 12px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo"><i class="fas fa-book-open"></i> Мой дневник</div>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> На главную</a>
    </div>
    <div class="container">
        <h1>Дела</h1>
        <div class="sub">Список задач на сегодня</div>
        <div class="form-card">
            <form method="POST" action="/add_task" class="input-group">
                <input type="text" name="title" placeholder="Что нужно сделать?" required>
                <button type="submit"><i class="fas fa-plus"></i> Добавить</button>
            </form>
        </div>
        {% for task in tasks %}
        <div class="task-card">
            <div class="task-left">
                <a href="/toggle_task/{{ task[0] }}" class="task-check {% if task[3] %}done{% endif %}">{% if task[3] %}✓{% else %}○{% endif %}</a>
                <span class="task-title {% if task[3] %}done{% endif %}">{{ task[2] }}</span>
            </div>
            <a href="/delete_task/{{ task[0] }}" class="delete-task" onclick="return confirm('Удалить?')"><i class="fas fa-trash"></i></a>
        </div>
        {% else %}
        <div style="text-align: center; padding: 60px; background: white; border-radius: 24px;">Нет дел</div>
        {% endfor %}
    </div>
</body>
</html>
