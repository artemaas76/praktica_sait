<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Планы | Дневник</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        .navbar { background: white; border-bottom: 1px solid #e2e8f0; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 700; color: #1e3a8a; }
        .back-btn { background: #f1f5f9; color: #1e293b; padding: 8px 16px; border-radius: 12px; text-decoration: none; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 24px; }
        h1 { font-size: 32px; font-weight: 700; color: #0f172a; }
        .sub { color: #64748b; margin-bottom: 32px; }
        .form-card { background: white; border-radius: 24px; padding: 24px; border: 1px solid #e2e8f0; margin-bottom: 32px; }
        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 16px; margin-bottom: 12px; }
        button { background: #1e3a8a; color: white; border: none; padding: 14px; border-radius: 16px; font-weight: 600; cursor: pointer; width: 100%; }
        .plan-card { background: white; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .plan-date { font-size: 13px; color: #64748b; }
        .delete-plan { background: #fee2e2; color: #ef4444; padding: 6px 12px; border-radius: 10px; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo"><i class="fas fa-book-open"></i> Мой дневник</div>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> На главную</a>
    </div>
    <div class="container">
        <h1>Планы</h1>
        <div class="sub">Что запланировано на будущее</div>
        <div class="form-card">
            <form method="POST" action="/add_plan">
                <input type="text" name="title" placeholder="Что планируешь?" required>
                <input type="date" name="plan_date" required>
                <button type="submit"><i class="fas fa-calendar-plus"></i> Добавить план</button>
            </form>
        </div>
        {% for plan in plans %}
        <div class="plan-card">
            <div><b>{{ plan[2] }}</b><div class="plan-date">{{ plan[3] }}</div></div>
            <a href="/delete_plan/{{ plan[0] }}" class="delete-plan" onclick="return confirm('Удалить?')"><i class="fas fa-trash"></i></a>
        </div>
        {% else %}
        <div style="text-align: center; padding: 60px; background: white; border-radius: 24px;">Нет планов</div>
        {% endfor %}
    </div>
</body>
</html>
