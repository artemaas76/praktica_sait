<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный дневник</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(125deg, #0B1120 0%, #1E2A4A 100%);
            min-height: 100vh;
        }
        .glass-nav {
            background: rgba(15, 25, 45, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(125deg, #A5F0FF, #6C8CFF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .user-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .username {
            color: #E2E8F0;
            font-weight: 500;
        }
        .logout-btn {
            background: rgba(255,70,85,0.2);
            border: 1px solid rgba(255,70,85,0.5);
            color: #FF6B7A;
            padding: 8px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: rgba(255,70,85,0.4);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 30px;
        }
        .hero {
            text-align: center;
            margin-bottom: 60px;
        }
        .hero h1 {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(125deg, #FFFFFF, #A5F0FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
        }
        .hero p {
            color: #94A3B8;
            font-size: 18px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
        }
        .card {
            background: rgba(20, 30, 55, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            padding: 32px 24px;
            text-align: center;
            transition: all 0.25s ease;
            text-decoration: none;
        }
        .card:hover {
            transform: translateY(-6px);
            background: rgba(30, 45, 75, 0.7);
            border-color: rgba(100, 140, 255, 0.4);
        }
        .card i {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .card h3 {
            color: #F1F5F9;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .card p {
            color: #7F8EA3;
            font-size: 14px;
        }
        .icon-notes { color: #60A5FA; }
        .icon-tasks { color: #34D399; }
        .icon-plans { color: #FBBF24; }
        .icon-goals { color: #F87171; }
        .icon-memories { color: #2DD4BF; }
        @media (max-width: 640px) {
            .glass-nav { padding: 15px 20px; }
            .hero h1 { font-size: 36px; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="glass-nav">
        <div class="logo"><i class="fas fa-feather-alt"></i> Мой дневник</div>
        <div class="user-section">
            <span class="username"><i class="fas fa-user-circle"></i> {{ session.name }}</span>
            <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Выйти</a>
        </div>
    </div>
    <div class="container">
        <div class="hero">
            <h1>Твоя жизнь — твои записи</h1>
            <p>Заметки, цели и важные моменты — всё в одном месте</p>
        </div>
        <div class="grid">
            <a href="/notes" class="card"><i class="fas fa-pen-fade icon-notes"></i><h3>Записи</h3><p>Личные мысли и заметки</p></a>
            <a href="/tasks" class="card"><i class="fas fa-check-double icon-tasks"></i><h3>Дела</h3><p>Список задач на день</p></a>
            <a href="/plans" class="card"><i class="fas fa-calendar-star icon-plans"></i><h3>Планы</h3><p>Что сделать к дате</p></a>
            <a href="/goals" class="card"><i class="fas fa-chart-line icon-goals"></i><h3>Копилка</h3><p>Отслеживай финансы</p></a>
            <a href="/memories" class="card"><i class="fas fa-images icon-memories"></i><h3>Фотоальбом</h3><p>Важные кадры</p></a>
        </div>
    </div>
</body>
</html>
