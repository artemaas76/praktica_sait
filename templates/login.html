<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1e2c;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            background: #0f121f;
            border: 1px solid #2a2f45;
            border-radius: 24px;
            padding: 32px;
            width: 360px;
        }
        h2 {
            margin-bottom: 8px;
            font-weight: 500;
            color: #ddd;
        }
        p {
            color: #6a7290;
            font-size: 14px;
            margin-bottom: 24px;
        }
        input {
            width: 100%;
            background: #11151f;
            border: 1px solid #2d3246;
            border-radius: 30px;
            padding: 12px 16px;
            margin-bottom: 16px;
            color: #ddd;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: #2d3246;
            border: none;
            padding: 12px;
            border-radius: 30px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #3d435c;
        }
        a {
            color: #7e88ac;
            text-decoration: none;
            font-size: 13px;
        }
        a:hover {
            color: #a5b0d0;
        }
        .flash {
            background: #2d3246;
            padding: 8px 12px;
            border-radius: 16px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .flash-success {
            color: #a0f0a0;
        }
        .flash-error {
            color: #f0a0a0;
        }
        .text-center {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>вход</h2>
    <p>заполни поля</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <input type="text" name="username" placeholder="логин" required autocomplete="off">
        <input type="password" name="password" placeholder="пароль" required>
        <button type="submit">войти</button>
    </form>
    <div class="text-center"><a href="/register">нет аккаунта? создать</a></div>
</div>
</body>
</html>
