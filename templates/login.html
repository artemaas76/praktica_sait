<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name=viewport content="width=device-width, initial-scale=1.0">
    <title>вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1.5rem;
            padding: 2rem;
            width: 380px;
        }
        .card h2 {
            font-size: 1.5rem;
            font-weight: 500;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
        }
        .card p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 2rem;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            color: #e2e8f0;
            font-size: 0.85rem;
        }
        button {
            width: 100%;
            background: #334155;
            border: none;
            padding: 0.7rem;
            border-radius: 2rem;
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
        }
        button:hover { background: #475569; }
        a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.8rem;
        }
        a:hover { color: #cbd5e1; }
        .center { text-align: center; margin-top: 1.5rem; }
        .flash {
            background: #334155;
            padding: 0.5rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>вход</h2>
    <p>заполни поля</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div class="flash">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <input type="text" name="username" placeholder="логин" required autocomplete="off">
        <input type="password" name="password" placeholder="пароль" required>
        <button type="submit">войти</button>
    </form>
    <div class="center"><a href="/register">нет аккаунта? создать</a></div>
</div>
</body>
</html>
