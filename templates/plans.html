<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Планы</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0F172A; }
        .top-bar { background: rgba(15,25,45,0.8); backdrop-filter: blur(10px); padding: 16px 30px; display: flex; justify-content: space-between; border-bottom: 1px solid #1E2A4A; }
        .logo { color: #A5F0FF; font-weight: 700; }
        .back-btn { color: #CBD5E1; text-decoration: none; background: #1E293B; padding: 8px 18px; border-radius: 40px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: #1E293B; border-radius: 28px; padding: 24px; margin-bottom: 32px; }
        .form-card input { width: 100%; background: #0F172A; border: 1px solid #334155; border-radius: 40px; padding: 12px 18px; margin-bottom: 12px; color: white; }
        .form-card button { background: #3B5DFF; border: none; border-radius: 40px; padding: 12px; width: 100%; color: white; font-weight: 600; cursor: pointer; }
        .plan-card { background: #1E293B; border-radius: 20px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2D3A5E; }
        .plan-title { font-weight: 600; color: #F1F5F9; }
        .plan-date { font-size: 12px; color: #6C8CFF; margin-top: 6px; }
        .delete-link { color: #F87171; text-decoration: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo"><i class="fas fa-calendar"></i> Планы</div>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> На главную</a>
    </div>
    <div class="container">
        <div class="form-card">
            <form method="POST" action="/add_plan">
                <input type="text" name="title" placeholder="Что запланировал?" required>
                <input type="date" name="plan_date" required>
                <button type="submit">➕ Добавить план</button>
            </form>
        </div>
        {% for plan in plans %}
        <div class="plan-card">
            <div>
                <div class="plan-title">{{ plan[2] }}</div>
                <div class="plan-date"><i class="far fa-calendar-alt"></i> {{ plan[3] }}</div>
            </div>
            <a href="/delete_plan/{{ plan[0] }}" class="delete-link" onclick="return confirm('Удалить план?')">🗑️</a>
        </div>
        {% else %}
        <div style="text-align:center; color:#64748B; padding:40px;">Нет планов, добавь что-нибудь важное 📅</div>
        {% endfor %}
    </div>
</body>
</html>
