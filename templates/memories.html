<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>мои воспоминания</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1e2c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ddd; padding: 20px; }
        .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3246; padding-bottom: 12px; margin-bottom: 25px; }
        .back { background: #2d3246; padding: 6px 14px; border-radius: 20px; text-decoration: none; color: #eee; font-size: 13px; }
        .form-card { background: #0f121f; border: 1px solid #2a2f45; border-radius: 18px; padding: 20px; margin-bottom: 25px; }
        input, textarea { width: 100%; background: #11151f; border: 1px solid #2d3246; border-radius: 14px; padding: 12px; color: #ddd; margin-bottom: 12px; }
        button { background: #2d3246; border: none; padding: 8px 20px; border-radius: 30px; color: white; width: 100%; cursor: pointer; }
        .memory { background: #0f121f; border: 1px solid #2a2f45; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .memory img { max-width: 100%; border-radius: 12px; margin-top: 10px; }
        .memory h4 { margin-bottom: 6px; }
        .memory-date { font-size: 11px; color: #6a7290; margin-bottom: 10px; }
        .del-memory { float: right; color: #c97a7a; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
<div class="top">
    <div style="font-size: 20px;">мои воспоминания</div>
    <a href="/" class="back">на главную</a>
</div>

<div class="form-card">
    <form method="POST" action="/add_memory" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="название" required>
        <textarea rows="4" name="content" placeholder="что вспомнилось?"></textarea>
        <input type="file" name="image" accept="image/*">
        <button type="submit">сохранить</button>
    </form>
</div>

{% for memory in memories %}
<div class="memory">
    <a href="/delete_memory/{{ memory[0] }}" class="del-memory" onclick="return confirm('удалить воспоминание?')">✖ удалить</a>
    <h4>{{ memory[2] }}</h4>
    <div class="memory-date">{{ memory[5] }}</div>
    <div>{{ memory[3] }}</div>
    {% if memory[4] %}<img src="/static/uploads/{{ memory[4] }}">{% endif %}
</div>
{% else %}
<div style="text-align:center; color:#6a7290; padding:30px;">пока ничего не добавлено</div>
{% endfor %}
</body>
</html>
