<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name=viewport content="width=device-width, initial-scale=1.0">
    <title>альбом</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e2e8f0; padding: 2rem 1.5rem; }
        .top { max-width: 800px; margin: 0 auto 2rem auto; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        .back { background: #1e293b; border: 1px solid #334155; padding: 0.4rem 1.2rem; border-radius: 2rem; text-decoration: none; color: #e2e8f0; font-size: 0.8rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 1rem; margin-bottom: 1.5rem; }
        input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.8rem; padding: 0.7rem; margin-bottom: 0.8rem; color: #e2e8f0; }
        button { background: #334155; border: none; padding: 0.5rem 1.2rem; border-radius: 2rem; color: white; cursor: pointer; width: 100%; }
        .memory { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; }
        .memory img { max-width: 100%; border-radius: 0.5rem; margin-top: 0.5rem; }
        .memory h4 { margin-bottom: 0.3rem; }
        .memory-date { font-size: 0.65rem; color: #94a3b8; margin-bottom: 0.5rem; }
        .del-memory { float: right; color: #f87171; text-decoration: none; font-size: 0.75rem; }
        .empty { text-align: center; color: #94a3b8; padding: 2rem; }
    </style>
</head>
<body>
<div class="top">
    <div style="font-size: 1.2rem;">🖼️ альбом</div>
    <a href="/" class="back">← назад</a>
</div>
<div class="container">
    <div class="form-card">
        <form method="POST" action="/add_memory" enctype="multipart/form-data">
            <input type="text" name="title" placeholder="название" required>
            <textarea rows="4" name="content" placeholder="что вспомнилось?"></textarea>
            <input type="file" name="image" accept="image/*">
            <button type="submit">сохранить</button>
        </form>
    </div>
    {% for memory in memories %}
    <div class="memory">
        <a href="/delete_memory/{{ memory[0] }}" class="del-memory" onclick="return confirm('удалить?')">✖ удалить</a>
        <h4>{{ memory[2] }}</h4>
        <div class="memory-date">{{ memory[5] }}</div>
        <div>{{ memory[3] }}</div>
        {% if memory[4] %}<img src="/static/uploads/{{ memory[4] }}">{% endif %}
    </div>
    {% else %}
    <div class="empty">пока ничего нет</div>
    {% endfor %}
</div>
</body>
</html>
