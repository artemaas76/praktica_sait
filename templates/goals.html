<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Копилка</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0F172A; }
        .top-bar { background: rgba(15,25,45,0.8); backdrop-filter: blur(10px); padding: 16px 30px; display: flex; justify-content: space-between; border-bottom: 1px solid #1E2A4A; }
        .logo { color: #A5F0FF; font-weight: 700; }
        .back-btn { color: #CBD5E1; text-decoration: none; background: #1E293B; padding: 8px 18px; border-radius: 40px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: #1E293B; border-radius: 28px; padding: 24px; margin-bottom: 32px; }
        .form-card input { width: 100%; background: #0F172A; border: 1px solid #334155; border-radius: 40px; padding: 12px 18px; margin-bottom: 12px; color: white; }
        .form-card button { background: #3B5DFF; border: none; border-radius: 40px; padding: 12px; width: 100%; color: white; font-weight: 600; cursor: pointer; }
        .goal-card { background: #1E293B; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #2D3A5E; }
        .goal-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .goal-title { font-weight: 700; color: #F1F5F9; font-size: 18px; }
        .progress-bar { background: #0F172A; border-radius: 20px; height: 12px; overflow: hidden; margin: 12px 0; }
        .progress-fill { background: #34D399; width: 0%; height: 100%; }
        .goal-stats { color: #94A3B8; font-size: 13px; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .add-form { display: flex; gap: 8px; margin-top: 12px; }
        .add-form input { flex: 1; background: #0F172A; border: 1px solid #334155; border-radius: 40px; padding: 10px 14px; color: white; }
        .add-form button { background: #10B981; width: auto; padding: 10px 18px; }
        .delete-link { color: #F87171; text-decoration: none; background: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo"><i class="fas fa-coins"></i> Копилка</div>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> На главную</a>
    </div>
    <div class="container">
        <div class="form-card">
            <form method="POST" action="/add_goal">
                <input type="text" name="title" placeholder="На что копим?" required>
                <input type="number" name="target_amount" placeholder="Сумма цели" step="0.01" required>
                <button type="submit">🎯 Поставить цель</button>
            </form>
        </div>
        {% for goal in goals %}
        <div class="goal-card">
            <div class="goal-header">
                <span class="goal-title">{{ goal[2] }}</span>
                <a href="/delete_goal/{{ goal[0] }}" class="delete-link" onclick="return confirm('Удалить цель?')">🗑️</a>
            </div>
            <div class="goal-stats">
                <span>Накоплено: {{ "%.2f"|format(goal[4]) }} ₽</span>
                <span>Цель: {{ "%.2f"|format(goal[3]) }} ₽</span>
                <span>{{ "%.0f"|format((goal[4]/goal[3]*100) if goal[3] > 0 else 0) }}%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width: {{ (goal[4]/goal[3]*100) if goal[3] > 0 else 0 }}%"></div></div>
            <form method="POST" action="/add_to_goal/{{ goal[0] }}" class="add-form">
                <input type="number" name="amount" placeholder="Сумма" step="0.01" required>
                <button type="submit">+ Пополнить</button>
            </form>
        </div>
        {% else %}
        <div style="text-align:center; color:#64748B; padding:40px;">Нет целей, добавь первую 💰</div>
        {% endfor %}
    </div>
</body>
</html>
