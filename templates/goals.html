<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>мои накопления</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1e2c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ddd; padding: 20px; }
        .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3246; padding-bottom: 12px; margin-bottom: 25px; }
        .back { background: #2d3246; padding: 6px 14px; border-radius: 20px; text-decoration: none; color: #eee; font-size: 13px; }
        .form-card { background: #0f121f; border: 1px solid #2a2f45; border-radius: 18px; padding: 20px; margin-bottom: 25px; }
        input { width: 100%; background: #11151f; border: 1px solid #2d3246; border-radius: 30px; padding: 10px 15px; margin-bottom: 12px; color: #ddd; }
        button { background: #2d3246; border: none; padding: 8px 20px; border-radius: 30px; color: white; width: 100%; cursor: pointer; }
        .goal { background: #0f121f; border: 1px solid #2a2f45; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .goal-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .goal-title { font-weight: 600; }
        .progress-bar { background: #2d3246; border-radius: 20px; height: 10px; margin: 12px 0; }
        .progress-fill { background: #4f6bff; height: 10px; border-radius: 20px; }
        .goal-stats { font-size: 12px; color: #6a7290; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .add-form { display: flex; gap: 8px; margin-top: 12px; }
        .add-form input { flex: 1; margin-bottom: 0; }
        .add-form button { width: auto; padding: 8px 16px; }
        .del-goal { float: right; color: #c97a7a; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>
<div class="top">
    <div style="font-size: 20px;">мои накопления</div>
    <a href="/" class="back">на главную</a>
</div>

<div class="form-card">
    <form method="POST" action="/add_goal">
        <input type="text" name="title" placeholder="на что копим?" required>
        <input type="number" name="target_amount" placeholder="сколько нужно" step="0.01" required>
        <button type="submit">поставить цель</button>
    </form>
</div>

{% for goal in goals %}
<div class="goal">
    <a href="/delete_goal/{{ goal[0] }}" class="del-goal" onclick="return confirm('удалить цель?')">✖ удалить</a>
    <div class="goal-header">
        <span class="goal-title">{{ goal[2] }}</span>
    </div>
    <div class="goal-stats">
        <span>накоплено: {{ "%.2f"|format(goal[4]) }} ₽</span>
        <span>нужно: {{ "%.2f"|format(goal[3]) }} ₽</span>
        <span>{{ "%.0f"|format((goal[4]/goal[3]*100) if goal[3] > 0 else 0) }}%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width: {{ (goal[4]/goal[3]*100) if goal[3] > 0 else 0 }}%"></div></div>
    <form method="POST" action="/add_to_goal/{{ goal[0] }}" class="add-form">
        <input type="number" name="amount" placeholder="сколько добавить?" step="0.01" required>
        <button type="submit">пополнить</button>
    </form>
</div>
{% else %}
<div style="text-align:center; color:#6a7290; padding:30px;">целей пока нет</div>
{% endfor %}
</body>
</html>
