<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>мои дела</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1e2c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ddd; padding: 20px; }
        .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3246; padding-bottom: 12px; margin-bottom: 25px; }
        .back { background: #2d3246; padding: 6px 14px; border-radius: 20px; text-decoration: none; color: #eee; font-size: 13px; }
        .form-card { background: #0f121f; border: 1px solid #2a2f45; border-radius: 18px; padding: 20px; margin-bottom: 25px; display: flex; gap: 10px; }
        .form-card input { flex: 1; background: #11151f; border: 1px solid #2d3246; border-radius: 30px; padding: 10px 15px; color: #ddd; }
        button { background: #2d3246; border: none; padding: 8px 20px; border-radius: 30px; color: white; cursor: pointer; }
        .task { background: #0f121f; border: 1px solid #2a2f45; border-radius: 16px; padding: 14px 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .task-left { display: flex; gap: 12px; align-items: center; }
        .task-check { text-decoration: none; font-size: 22px; }
        .done { text-decoration: line-through; color: #7e88ac; }
        .del-task { color: #c97a7a; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
<div class="top">
    <div style="font-size: 20px;">мои дела</div>
    <a href="/" class="back">на главную</a>
</div>

<div class="form-card">
    <form method="POST" action="/add_task" style="display: flex; gap: 10px; width: 100%;">
        <input type="text" name="title" placeholder="что нужно сделать?">
        <button type="submit">добавить</button>
    </form>
</div>

{% for task in tasks %}
<div class="task">
    <div class="task-left">
        <a href="/toggle_task/{{ task[0] }}" class="task-check">{% if task[3] %}✅{% else %}⬜{% endif %}</a>
        <span class="{% if task[3] %}done{% endif %}">{{ task[2] }}</span>
    </div>
    <a href="/delete_task/{{ task[0] }}" class="del-task" onclick="return confirm('удалить дело?')">🗑️ удалить</a>
</div>
{% else %}
<div style="text-align:center; color:#6a7290; padding:30px;">дел нет, можно отдохнуть</div>
{% endfor %}
</body>
</html>
