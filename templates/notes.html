<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Записи | Дневник</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        .navbar { background: white; border-bottom: 1px solid #e2e8f0; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 700; color: #1e3a8a; }
        .back-btn { background: #f1f5f9; color: #1e293b; padding: 8px 16px; border-radius: 12px; text-decoration: none; font-size: 14px; font-weight: 500; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
        h1 { font-size: 32px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        .sub { color: #64748b; margin-bottom: 32px; }
        .form-card { background: white; border-radius: 24px; padding: 24px; border: 1px solid #e2e8f0; margin-bottom: 32px; }
        input, textarea { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 16px; font-size: 14px; margin-bottom: 12px; }
        input:focus, textarea:focus { outline: none; border-color: #1e3a8a; }
        button { background: #1e3a8a; color: white; border: none; padding: 12px 24px; border-radius: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #0f172a; }
        .note-card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
        .note-title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        .note-date { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        .delete-btn { float: right; background: #fee2e2; color: #ef4444; padding: 6px 12px; border-radius: 12px; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo"><i class="fas fa-book-open"></i> Мой дневник</div>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> На главную</a>
    </div>
    <div class="container">
        <h1>Записи</h1>
        <div class="sub">Твои мысли и заметки</div>
        <div class="form-card">
            <form method="POST" action="/add_note">
                <input type="text" name="title" placeholder="Заголовок" required>
                <textarea name="content" rows="4" placeholder="Текст записи..."></textarea>
                <button type="submit"><i class="fas fa-save"></i> Сохранить</button>
            </form>
        </div>
        {% for note in notes %}
        <div class="note-card">
            <a href="/delete_note/{{ note[0] }}" class="delete-btn" onclick="return confirm('Удалить?')"><i class="fas fa-trash"></i> Удалить</a>
            <div class="note-title">{{ note[2] }}</div>
            <div class="note-date"><i class="far fa-calendar-alt"></i> {{ note[4] }}</div>
            <div>{{ note[3] }}</div>
        </div>
        {% else %}
        <div style="text-align: center; padding: 60px; background: white; border-radius: 24px;">Нет записей</div>
        {% endfor %}
    </div>
</body>
</html>
