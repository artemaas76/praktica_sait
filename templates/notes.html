<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name=viewport content="width=device-width, initial-scale=1.0">
    <title>записи</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e2e8f0; padding: 2rem 1.5rem; }
        .top { max-width: 800px; margin: 0 auto 2rem auto; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        .back { background: #1e293b; border: 1px solid #334155; padding: 0.4rem 1.2rem; border-radius: 2rem; text-decoration: none; color: #e2e8f0; font-size: 0.8rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 1.2rem; margin-bottom: 1.5rem; }
        input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.8rem; padding: 0.7rem; margin-bottom: 0.8rem; color: #e2e8f0; font-size: 0.85rem; }
        button { background: #334155; border: none; padding: 0.5rem 1.2rem; border-radius: 2rem; color: white; cursor: pointer; }
        button:hover { background: #475569; }
        .note-card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 1rem; margin-bottom: 0.8rem; }
        .note-title { font-size: 1rem; font-weight: 500; margin-bottom: 0.3rem; }
        .note-date { font-size: 0.65rem; color: #94a3b8; margin-bottom: 0.5rem; }
        .del { float: right; color: #f87171; text-decoration: none; font-size: 0.75rem; }
        .empty { text-align: center; color: #94a3b8; padding: 2rem; }
    </style>
</head>
<body>
<div class="top">
    <div style="font-size: 1.2rem;">📝 записи</div>
    <a href="/" class="back">← назад</a>
</div>
<div class="container">
    <div class="form-card">
        <form method="POST" action="/add_note">
            <input type="text" name="title" placeholder="заголовок" required>
            <textarea rows="4" name="content" placeholder="что напишешь?"></textarea>
            <button type="submit">сохранить</button>
        </form>
    </div>
    {% for note in notes %}
    <div class="note-card">
        <a href="/delete_note/{{ note[0] }}" class="del" onclick="return confirm('удалить?')">✖ удалить</a>
        <div class="note-title">{{ note[2] }}</div>
        <div class="note-date">{{ note[4] }}</div>
        <div>{{ note[3] }}</div>
    </div>
    {% else %}
    <div class="empty">пока ничего нет</div>
    {% endfor %}
</div>
</body>
</html>
