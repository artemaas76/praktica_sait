<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Записи</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0F172A; }
        .top-bar {
            background: rgba(15, 25, 45, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1E2A4A;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { color: #A5F0FF; font-weight: 700; font-size: 20px; }
        .back-btn { color: #CBD5E1; text-decoration: none; background: #1E293B; padding: 8px 18px; border-radius: 40px; font-size: 14px; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .form-card {
            background: #1E293B;
            border-radius: 28px;
            padding: 26px;
            margin-bottom: 32px;
            border: 1px solid #334155;
        }
        input, textarea {
            width: 100%;
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 12px 18px;
            color: #F1F5F9;
            font-size: 14px;
            margin-bottom: 14px;
        }
        button {
            background: #3B5DFF;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .note-card {
            background: #1E293B;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #2D3A5E;
        }
        .note-title { font-size: 18px; font-weight: 700; color: #F1F5F9; margin-bottom: 6px; }
        .note-date { font-size: 11px; color: #6C8CFF; margin-bottom: 12px; }
        .delete-btn { float: right; background: none; border: none; color: #F87171; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo"><i class="fas fa-feather-alt"></i> Заметки</div>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> На главную</a>
    </div>
    <div class="container">
        <div class="form-card">
            <form method="POST" action="/add_note">
                <input type="text" name="title" placeholder="О чём думаешь?" required>
                <textarea rows="4" name="content" placeholder="Текст записи..."></textarea>
                <button><i class="fas fa-save"></i> Сохранить</button>
            </form>
        </div>
        {% for note in notes %}
        <div class="note-card">
            <a href="/delete_note/{{ note[0] }}" class="delete-btn" onclick="return confirm('Удалить запись?')"><i class="fas fa-trash"></i></a>
            <div class="note-title">{{ note[2] }}</div>
            <div class="note-date">{{ note[4] }}</div>
            <div style="color:#CBD5E1;">{{ note[3] }}</div>
        </div>
        {% else %}
        <div style="text-align:center; color:#64748B; padding:40px;">Пока нет записей, добавь первую ✍️</div>
        {% endfor %}
    </div>
</body>
</html>
