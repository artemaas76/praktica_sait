<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>мои записи</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1e2c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ddd; padding: 20px; }
        .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3246; padding-bottom: 12px; margin-bottom: 25px; }
        .back { background: #2d3246; padding: 6px 14px; border-radius: 20px; text-decoration: none; color: #eee; font-size: 13px; }
        .form-card { background: #0f121f; border: 1px solid #2a2f45; border-radius: 18px; padding: 20px; margin-bottom: 25px; }
        input, textarea { width: 100%; background: #11151f; border: 1px solid #2d3246; border-radius: 14px; padding: 12px; color: #ddd; margin-bottom: 12px; font-size: 14px; }
        button { background: #2d3246; border: none; padding: 8px 20px; border-radius: 30px; color: white; cursor: pointer; }
        .note { background: #0f121f; border: 1px solid #2a2f45; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        .note h4 { margin-bottom: 6px; }
        .date { font-size: 11px; color: #6a7290; margin-bottom: 10px; }
        .del { float: right; color: #c97a7a; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
<div class="top">
    <div style="font-size: 20px;">мои записи</div>
    <a href="/" class="back">на главную</a>
</div>

<div class="form-card">
    <form method="POST" action="/add_note">
        <input type="text" name="title" placeholder="заголовок" required>
        <textarea rows="4" name="content" placeholder="что напишешь?"></textarea>
        <button type="submit">сохранить</button>
    </form>
</div>

{% for note in notes %}
<div class="note">
    <a href="/delete_note/{{ note[0] }}" class="del" onclick="return confirm('удалить запись?')">✖ удалить</a>
    <h4>{{ note[2] }}</h4>
    <div class="date">{{ note[4] }}</div>
    <div>{{ note[3] }}</div>
</div>
{% else %}
<div style="text-align:center; color:#6a7290; padding:30px;">пока ничего не записано</div>
{% endfor %}
</body>
</html>
